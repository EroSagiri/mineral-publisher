[package]
name = "mineral-publisher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mineral"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies]
mineral-core = { path = "../mineral-core" }
axum = "0.7"
futures-core = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
infer = "0.22.0"
kamadak-exif = "0.6.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
toml = { version = "0.8", default-features = false, features = ["parse"] }
uuid = { version = "1.20.0", features = ["v4"] }
